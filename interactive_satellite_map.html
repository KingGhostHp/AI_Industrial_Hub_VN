// Setup search tab functionality
function setupSearchTab() {
  const searchInputSidebar = document.getElementById('searchInputSidebar');
  const searchSuggestionSidebar = document.getElementById('searchSuggestionSidebar');
  const searchContainer = document.getElementById('searchContainer');
  const clearSearchBtn = document.getElementById('clearSearchBtn');
  const radiusInputSidebar = document.getElementById('radiusInputSidebar');
  const searchFromGeocoderBtnSidebar = document.getElementById('searchFromGeocoderBtnSidebar');
  const searchFromSelectedBtnSidebar = document.getElementById('searchFromSelectedBtnSidebar');

  // Show/hide clear button
  searchInputSidebar.addEventListener('input', () => {
    const val = searchInputSidebar.value;
    clearSearchBtn.style.display = val ? 'block' : 'none';
    
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (!val.trim()) {
        showDefaultSuggestionsSidebar();
        return;
      }
      handleSearchSidebar(val, false);
    }, 250);
  });

  // Clear button handler
  clearSearchBtn.addEventListener('click', () => {
    searchInputSidebar.value = '';
    clearSearchBtn.style.display = 'none';
    searchSuggestionSidebar.style.display = 'none';
    searchInputSidebar.focus();
  });

  // Focus effect - Google Maps style
  searchInputSidebar.addEventListener('focus', () => {
    searchContainer.style.boxShadow = '0 4px 12px rgba(0, 0, 0, 0.25)';
    if (!searchInputSidebar.value.trim()) {
      showDefaultSuggestionsSidebar();
    }
  });

  searchInputSidebar.addEventListener('blur', () => {
    searchContainer.style.boxShadow = '0 2px 8px rgba(0, 0, 0, 0.15)';
  });

  // Close dropdown when clicking outside
  document.addEventListener('click', (e) => {
    if (!searchContainer.contains(e.target) && !searchSuggestionSidebar.contains(e.target)) {
      searchSuggestionSidebar.style.display = 'none';
    }
  });

  // Search input handler
  let searchTimer = null;

  searchInputSidebar.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      handleSearchSidebar(searchInputSidebar.value);
    }
  });

  // Radius search handlers
  searchFromGeocoderBtnSidebar.addEventListener('click', () => {
    const radius = Number(radiusInputSidebar.value) || 0;
    if (!lastGeocoderPoint) {
      alert('Hãy tìm một vị trí (geocoder) trước.');
      return;
    }
    runNearbySearchSidebar(lastGeocoderPoint, radius, 'vị trí tìm kiếm');
  });

  searchFromSelectedBtnSidebar.addEventListener('click', () => {
    const radius = Number(radiusInputSidebar.value) || 0;
    if (!lastSelectedIndustrial) {
      alert('Hãy click chọn một KCN/CCN trước.');
      return;
    }
    const coords = lastSelectedIndustrial.geometry?.coordinates;
    runNearbySearchSidebar(coords, radius, lastSelectedIndustrial.properties?.name || 'điểm đã chọn');
  });
}

// Handle search in sidebar
async function handleSearchSidebar(query, autoFocus = true) {
  const q = (query || '').trim();
  lastSearchQuery = q;
  const searchSuggestionSidebar = document.getElementById('searchSuggestionSidebar');
  
  if (q.length < 2) {
    searchSuggestionSidebar.style.display = 'none';
    return;
  }
  
  searchSuggestionSidebar.style.display = 'block';
  searchSuggestionSidebar.innerHTML = 'Đang tìm...';
  
  const [izMatches, osmMatches, strategicMatches] = await Promise.all([
    Promise.resolve(localSearchIndustrial(q)),
    nominatimFetch(q),
    enhanceSearchWithStrategicLocations(q),
  ]);
  
  // Prioritize: Industrial zones first, then strategic locations, then OSM
  // Increase limit to 20 results to show more options
  const combined = [...izMatches, ...strategicMatches, ...osmMatches].slice(0, 20);
  if (!combined.length) {
    searchSuggestionSidebar.innerHTML = 'Không tìm thấy.';
    return;
  }
  
  renderSuggestionsSidebar(combined);
  if (autoFocus) focusSuggestion(combined[0]);
}

// Render suggestions in sidebar - Google Maps style
function renderSuggestionsSidebar(items) {
  const searchSuggestionSidebar = document.getElementById('searchSuggestionSidebar');
  searchSuggestionSidebar.style.display = 'block';
  
  searchSuggestionSidebar.innerHTML = items
    .map((item, idx) => {
      // Determine icon based on type
      let icon = 'map-pin';
      let iconColor = '#5f6368';
      let sublabel = '';
      
      if (item.type === 'iz') {
        icon = 'factory';
        iconColor = '#ff9f1c';
        // Show province and additional info for industrial zones
        const props = item.feature?.properties || {};
        const parts = [];
        if (props.province) parts.push(props.province);
        if (props.acreage) parts.push(`${props.acreage} ha`);
        sublabel = parts.join(' • ');
      } else if (item.type === 'strategic') {
        icon = 'map-pin';
        iconColor = '#3B82F6';
        // Extract type name from label (it's in parentheses)
        const match = item.label.match(/\(([^)]+)\)/);
        sublabel = match ? match[1] : 'Địa điểm quan trọng';
      } else if (item.type === 'osm') {
        icon = 'search';
        iconColor = '#5f6368';
        sublabel = 'OpenStreetMap';
      }
      
      return `
        <div data-idx="${idx}" style="
          padding: 12px 16px;
          cursor: pointer;
          display: flex;
          align-items: center;
          gap: 12px;
          transition: background 0.15s ease;
          border-bottom: 1px solid #f0f0f0;
        " class="suggestion-item">
          <i data-lucide="${icon}" style="width: 20px; height: 20px; color: ${iconColor}; flex-shrink: 0;"></i>

// Run nearby search from sidebar
function runNearbySearchSidebar(center, radiusKm, label) {
  const searchResultSidebar = document.getElementById('searchResultSidebar');
  const searchListSidebar = document.getElementById('searchListSidebar');
  
  if (!center) {
    searchResultSidebar.textContent = 'Không có dữ liệu tọa độ.';
    searchListSidebar.style.display = 'none';
    return;
  }
  
  // Search industrial zones
  const industrialResults = [];
  if (industrialGeojson?.features?.length) {
    industrialGeojson.features.forEach((feature) => {
      const coords = feature.geometry?.coordinates;
      if (!coords) return;
      const dist = haversineDistance(center, coords);
      if (dist <= radiusKm) {
        industrialResults.push({
          type: 'iz',
          name: feature.properties?.name || 'Không rõ',
          distance: dist,
          feature: feature,
          coords: coords
        });
      }
    });
  }
  
  // Search strategic locations
  const strategicResults = [];
  if (strategicLocationsSystem) {
    const { locationManager } = strategicLocationsSystem;
    const allLocationsData = locationManager.getAllLocations();
    
    if (allLocationsData?.features) {
      allLocationsData.features.forEach((location) => {
        const coords = location.geometry?.coordinates;
        if (!coords) return;
        const dist = haversineDistance(center, coords);
        if (dist <= radiusKm) {
          const locationType = location.properties?.type || location.properties?.locationType;
          const typeName = locationType === 'seaport' ? 'Cảng biển' :
                          locationType === 'airport' ? 'Sân bay' :
                          locationType === 'city_center' ? 'Trung tâm TP' : 'Địa điểm';
          strategicResults.push({
            type: 'strategic',
            name: location.properties?.name || 'Không rõ',
            typeName: typeName,
            distance: dist,
            location: location,
            coords: coords
          });
        }
      });
    }
  }
  
  // Combine and sort by distance
  const allResults = [...industrialResults, ...strategicResults].sort((a, b) => a.distance - b.distance);
  
  if (!allResults.length) {
    searchResultSidebar.textContent = `Không tìm thấy địa điểm nào trong bán kính ${radiusKm} km quanh ${label}.`;
    searchListSidebar.style.display = 'none';
    return;
  }
  
  const izCount = industrialResults.length;
  const slCount = strategicResults.length;
  searchResultSidebar.textContent = `Tìm thấy ${allResults.length} địa điểm (${izCount} KCN/CCN, ${slCount} địa điểm quan trọng) trong bán kính ${radiusKm} km quanh ${label}:`;
  searchListSidebar.style.display = 'block';
  
  searchListSidebar.innerHTML = allResults.map((result) => {
    const dist = result.distance.toFixed(2);
    const icon = result.type === 'iz' ? '🏭' : 
                 result.typeName === 'Cảng biển' ? '⚓' :
                 result.typeName === 'Sân bay' ? '✈️' : '🏙️';
    const typeLabel = result.type === 'iz' ? 'KCN/CCN' : result.typeName;
    
    const clickHandler = result.type === 'iz' 
      ? `focusOnIndustrialFeature(industrialGeojson.features.find(f => f.properties.name === '${result.name.replace(/'/g, "\\'")}'))`
      : `map.flyTo({ center: [${result.coords[0]}, ${result.coords[1]}], zoom: 13 })`;
    
    return `<div style="padding: 8px; cursor: pointer; border-radius: 4px; margin-bottom: 4px; background: rgba(255,255,255,0.05); border-left: 3px solid ${result.type === 'iz' ? '#ff9f1c' : '#3B82F6'};" 
                 onmouseenter="this.style.background='rgba(255,255,255,0.1)'" 
                 onmouseleave="this.style.background='rgba(255,255,255,0.05)'"
                 onclick="${clickHandler}">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 18px;">${icon}</span>
        <div style="flex: 1;">
          <strong>${result.name}</strong><br>
          <span style="color: rgba(255,255,255,0.6); font-size: 11px;">${typeLabel} • Cách ${dist} km</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Setup layers tab functionality
function setupLayersTab() {
  const toggleProvinceBtnSidebar = document.getElementById('toggleProvinceBtnSidebar');
  const provinceStatusSidebar = document.getElementById('provinceStatusSidebar');
  const toggleCartoBtnSidebar = document.getElementById('toggleCartoBtnSidebar');
  const cartoStatusSidebar = document.getElementById('cartoStatusSidebar');
  const exportBtnSidebar = document.getElementById('exportBtnSidebar');

  // Set initial province status to "Đang hiện" since it's enabled by default
  provinceStatusSidebar.textContent = 'Đang hiện';
  provinceStatusSidebar.style.color = '#10B981';

  // Province layer toggle
  toggleProvinceBtnSidebar.addEventListener('click', async () => {
    provinceVisible = !provinceVisible;
    provinceStatusSidebar.textContent = provinceVisible ? 'Đang hiện' : 'Đang ẩn';
    provinceStatusSidebar.style.color = provinceVisible ? '#10B981' : '#EF4444';
    
    // Load on-demand nếu chưa load
    if (provinceVisible && !provinceGeojson) {
      provinceStatusSidebar.textContent = 'Đang tải...';
      await loadProvinceBoundaries();
      await addMaritimeClaims();
      provinceStatusSidebar.textContent = 'Đang hiện';
    }
    
    toggleProvinceLayer(provinceVisible);
  });

  // Map style toggle - Cycle through 3 styles: Streets → Satellite → Tencent
  toggleCartoBtnSidebar.addEventListener('click', () => {
    // Determine next style
    let nextStyle;
    let nextStyleName;
    
    if (currentBaseStyle === BASE_STYLE_STREET) {
      nextStyle = BASE_STYLE_SAT;
      nextStyleName = 'Satellite';
    } else if (currentBaseStyle === BASE_STYLE_SAT) {
      nextStyle = BASE_STYLE_TENCENT;
      nextStyleName = '腾讯 (Tencent)';
    } else {
      nextStyle = BASE_STYLE_STREET;
      nextStyleName = 'Streets';
    }
    
    currentBaseStyle = nextStyle;
    cartoStatusSidebar.innerHTML = `
      ${nextStyleName}
      <i data-lucide="chevron-right" style="width: 14px; height: 14px; opacity: 0.6;"></i>
    `;
    
    // Re-initialize Lucide icons
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
    
    const needProvince = !!provinceGeojson;
    const needIndustrial = !!industrialGeojson;
    map.setStyle(currentBaseStyle);
    map.once('styledata', () => {
      if (needProvince) {
        addProvinceLayer(provinceGeojson);
      } else {
        loadProvinceBoundaries();
      }
      addMaritimeClaims();
      if (needIndustrial) {
        addIndustrialLayer(industrialGeojson);
        updateIndustrialCount(); // Update count after re-adding layer
      } else {
        loadIndustrialZones();
      }
    });
  });

  // Export button
  exportBtnSidebar.addEventListener('click', () => {
    const data = draw.getAll();
    if (!data.features.length) {
      alert('Chưa có đối tượng nào được vẽ.');
      return;
    }
    const geojson = JSON.stringify(data, null, 2);
    const blob = new Blob([geojson], { type: 'application/vnd.geo+json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'industrial_zones.geojson';
    link.click();
    URL.revokeObjectURL(url);
  });
}

/**
 * Initialize GPS/Geolocation functionality
 */
function initializeGPS() {
  console.log('🌍 Initializing GPS/Geolocation...');
  
  const gpsButton = document.getElementById('gpsButton');
  const searchFromMyLocationBtn = document.getElementById('searchFromMyLocationBtn');
  
  // GPS button click handler
  if (gpsButton) {
    gpsButton.addEventListener('click', () => {
      getUserLocation();
    });
  }
  
  // "Find KCN/CCN near me" button handler
  if (searchFromMyLocationBtn) {
    searchFromMyLocationBtn.addEventListener('click', () => {
      if (!userLocation) {
        // Get location first, then search
        const gpsBtn = document.getElementById('gpsButton');
        gpsBtn.classList.add('loading');
        
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const { latitude, longitude, accuracy } = position.coords;
            
            userLocation = {
              lat: latitude,
              lng: longitude,
              accuracy: accuracy
            };
            
            gpsBtn.classList.remove('loading');
            gpsBtn.classList.add('active');

            
            showUserLocation(longitude, latitude, accuracy);
            
            // Now search nearby
            findNearbyIndustrialZones();
          },
          (error) => {
            gpsBtn.classList.remove('loading');
            alert('❌ Không thể xác định vị trí của bạn. Vui lòng bật GPS và cho phép truy cập vị trí.');
            console.error('Geolocation error:', error);
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        // Location already available, just search
        findNearbyIndustrialZones();
      }
    });
  }
  
  // "Set manual location" button handler
  const setManualLocationBtn = document.getElementById('setManualLocationBtn');
  if (setManualLocationBtn) {
    setManualLocationBtn.addEventListener('click', () => {
      // Show options
      const choice = confirm(
        '📍 Chọn cách đặt vị trí:\n\n' +
        'OK = Nhập tọa độ thủ công\n' +
        'Cancel = Click trên bản đồ'
      );
      
      if (choice) {
        setManualLocation();
      } else {
        enableClickToSetLocation();
      }
    });
  }
  
  // Initialize Lucide icons for GPS button
  if (typeof lucide !== 'undefined') {
    lucide.createIcons();
  }
  
  console.log('✅ GPS/Geolocation initialized');
}
