<!DOCTYPE html>
<html lang="vi">
<head>

  <title>Test Recommendation Card Component</title>
  
  <!-- Mapbox GL JS -->

  <!-- AI Investment Advisor Styles -->
  <link rel="stylesheet" href="../styles/ai-investment-advisor.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
    }
    
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #3B82F6;
    }
    
    .test-controls {
      background: rgba(0, 0, 0, 0.85);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .test-controls button {
      padding: 10px 20px;
      background: #3B82F6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    
    .test-controls button:hover {
      background: #2563EB;
      transform: translateY(-1px);
    }
    
    .selected-zones {
      background: rgba(0, 0, 0, 0.85);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    
    .selected-zones h3 {
      margin: 0 0 12px 0;
      font-size: 16px;
      color: #3B82F6;
    }
    
    .selected-zones-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    
    .selected-zone-tag {
      padding: 6px 12px;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid #3B82F6;
      border-radius: 6px;
      font-size: 13px;
    }
    
    #map {
      width: 100%;
      height: 400px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏭 Recommendation Card Component Test</h1>
    
    <div class="test-controls">
      <button id="btn-load-sample">Load Sample Recommendations</button>
      <button id="btn-clear">Clear All</button>
      <button id="btn-select-all">Select All</button>
      <button id="btn-deselect-all">Deselect All</button>
    </div>
    
    <div class="selected-zones">
      <h3>Selected Zones for Comparison (<span id="selected-count">0</span>/5)</h3>
      <div class="selected-zones-list" id="selected-zones-list">
        <span style="color: rgba(255, 255, 255, 0.6); font-size: 13px;">No zones selected</span>
      </div>
    </div>
    
    <div id="map"></div>
    
    <div class="recommendations-container" id="recommendations-container">
      <div class="recommendations-empty">
        <div class="recommendations-empty-icon">📊</div>
        <p class="recommendations-empty-text">Click "Load Sample Recommendations" to see cards</p>
      </div>
    </div>
  </div>

    // Initialize Mapbox
    mapboxgl.accessToken = 'pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4NXVycTA2emYycXBndHRqcmZ3N3gifQ.rJcFIG214AriISLbB6B5aw'; // Public token for testing
    
    const map = new mapboxgl.Map({

        },

          infrastructure: { score: 85, weight: 0.25 },

        },
        rank: 2,

          nearestAirport: { name: 'Sân bay Long Thành', distance: 15.8, cost: 237000 },
          nearestCity: { name: 'Biên Hòa', distance: 5.2, cost: 78000 }

      {

      },
      {

        },

        growthPotential: 65,
        logisticsCosts: {
          nearestPort: { name: 'Cảng Tiên Sa', distance: 8.5, cost: 127500 },
          nearestAirport: { name: 'Sân bay Đà Nẵng', distance: 6.2, cost: 93000 },
          nearestCity: { name: 'Đà Nẵng', distance: 7.8, cost: 117000 }
        }
      }
    ];
    
    // Handle zone selection
    function handleZoneSelection(recommendation, isSelected) {
      const zoneId = recommendation.zone.properties.code;
      
      if (isSelected) {
        if (selectedZones.size >= MAX_SELECTIONS) {
          alert(`Chỉ có thể chọn tối đa ${MAX_SELECTIONS} khu để so sánh!`);
          // Uncheck the checkbox
          const card = document.querySelector(`[data-zone-id="${zoneId}"] .select-checkbox`);
          if (card) card.checked = false;
          return;
        }
        selectedZones.add(zoneId);
      } else {
        selectedZones.delete(zoneId);
      }
      
      updateSelectedZonesDisplay();
    }
    
    // Handle card click
    function handleCardClick(recommendation) {
      console.log('Card clicked:', recommendation.zone.properties.name);
      console.log('Zone details:', recommendation);
    }
    
    // Update selected zones display
    function updateSelectedZonesDisplay() {
      const countEl = document.getElementById('selected-count');
      const listEl = document.getElementById('selected-zones-list');
      
      countEl.textContent = selectedZones.size;
      
      if (selectedZones.size === 0) {
        listEl.innerHTML = '<span style="color: rgba(255, 255, 255, 0.6); font-size: 13px;">No zones selected</span>';
      } else {
        listEl.innerHTML = Array.from(selectedZones)
          .map(zoneId => `<span class="selected-zone-tag">${zoneId}</span>`)
          .join('');
      }
    }
    
    // Load sample recommendations
    function loadSampleRecommendations() {
      const container = document.getElementById('recommendations-container');
      container.innerHTML = '';
      
      sampleRecommendations.forEach(data => {
        const recommendation = Recommendation.fromJSON(data);
        const card = new RecommendationCard(
          recommendation,
          map,
          handleZoneSelection,
          handleCardClick
        );
        
        container.appendChild(card.render());
      });
    }
    
    // Clear all cards
    function clearAll() {
      const container = document.getElementById('recommendations-container');
      container.innerHTML = `
        <div class="recommendations-empty">
          <div class="recommendations-empty-icon">📊</div>
          <p class="recommendations-empty-text">Click "Load Sample Recommendations" to see cards</p>
        </div>
      `;
      selectedZones.clear();
      updateSelectedZonesDisplay();
    }
    
    // Select all zones
    function selectAll() {
      const checkboxes = document.querySelectorAll('.select-checkbox');
      let count = 0;
      
      checkboxes.forEach(checkbox => {
        if (count < MAX_SELECTIONS && !checkbox.checked) {
          checkbox.checked = true;
          checkbox.dispatchEvent(new Event('change', { bubbles: true }));
          count++;
        }
      });
    }
    
    // Deselect all zones
    function deselectAll() {
      const checkboxes = document.querySelectorAll('.select-checkbox');
      checkboxes.forEach(checkbox => {
        if (checkbox.checked) {
          checkbox.checked = false;
          checkbox.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
    }
    
    // Event listeners
    document.getElementById('btn-load-sample').addEventListener('click', loadSampleRecommendations);
    document.getElementById('btn-clear').addEventListener('click', clearAll);
    document.getElementById('btn-select-all').addEventListener('click', selectAll);
    document.getElementById('btn-deselect-all').addEventListener('click', deselectAll);
    
    // Load sample data on page load
    map.on('load', () => {
      loadSampleRecommendations();
    });
  </script>
</body>
</html>
